version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ayurvoice-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-ayurvoice}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayurvoice-redis
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ayurvoice-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-ayurvoice}
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_CELERY=true
      - SECRET_KEY=${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID}
      - ELEVENLABS_API_KEY_BACKUP=${ELEVENLABS_API_KEY_BACKUP:-}
      - ELEVENLABS_AGENT_ID_BACKUP=${ELEVENLABS_AGENT_ID_BACKUP:-agent_6201m7ajf2jbeztrpae3xhw418np}
      - ELEVENLABS_API_KEY_BACKUP=${ELEVENLABS_API_KEY_BACKUP:-}
      - ELEVENLABS_AGENT_ID_BACKUP=${ELEVENLABS_AGENT_ID_BACKUP:-agent_6201m7ajf2jbeztrpae3xhw418np}
      - ELEVENLABS_MIN_CHARACTERS_THRESHOLD=${ELEVENLABS_MIN_CHARACTERS_THRESHOLD:-300}
      - ELEVENLABS_PHONE_NUMBER_ID=${ELEVENLABS_PHONE_NUMBER_ID:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - BASE_URL=https://aireceptionist-api.marketbytes.in
    command: >
      sh -c "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ayurvoice-celery-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-ayurvoice}
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_CELERY=true
      - SECRET_KEY=${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID}
      - ELEVENLABS_API_KEY_BACKUP=${ELEVENLABS_API_KEY_BACKUP:-}
      - ELEVENLABS_AGENT_ID_BACKUP=${ELEVENLABS_AGENT_ID_BACKUP:-agent_6201m7ajf2jbeztrpae3xhw418np}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
    command: celery -A backend.app.tasks.celery_app.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://aireceptionist-api.marketbytes.in/api/v1
        - NEXT_PUBLIC_ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID:-agent_0901m79nh3fcfhj9yn7f6ktqggfx}
    container_name: ayurvoice-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://aireceptionist-api.marketbytes.in/api/v1
      - NEXT_PUBLIC_ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID:-agent_0901m79nh3fcfhj9yn7f6ktqggfx}

volumes:
  pgdata:

